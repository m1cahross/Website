<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Us — The Levitt Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_base.css" />
  <style>
    .join-form { margin-top: 40px; display: flex; flex-direction: column; gap: 16px; max-width: 560px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field label { font-weight: 600; font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; color: #666; }
    .form-field input, .form-field textarea { font-family: 'Poppins', sans-serif; font-size: 1rem; padding: 14px 18px; border: 2px solid var(--gray); border-radius: 10px; background: var(--white); color: var(--black); outline: none; transition: border-color 0.2s; resize: vertical; }
    .form-field input:focus, .form-field textarea:focus { border-color: var(--purple-light); }
    .submit-btn { align-self: flex-start; margin-top: 8px; padding: 16px 40px; background: var(--purple-grad); color: var(--white); font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1rem; letter-spacing: 0.04em; border: none; border-radius: 10px; cursor: pointer; transition: opacity 0.2s, transform 0.15s; }
    .submit-btn:hover { opacity: 0.88; transform: translateY(-2px); }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">
      <img src="tll-logo.svg" alt="The Levitt Lab" />
    </a>
    <a class="nav-faq" href="faqs.html">FAQs</a>
  </nav>

  <a class="back-link" href="index.html">← Back</a>

  <div class="page-hero">
    <span class="page-tag">Apply</span>
    <h1 class="page-title">Ready for<br>change?</h1>
    <p class="page-lead">Tell us a little about yourself. We read every submission and will reach out personally within a few days.</p>
  </div>

  <div class="page-content">
    <form class="join-form" name="interest" method="POST">
      <div class="form-field"><label for="name">Your name</label><input id="name" name="name" type="text" placeholder="First and last" required /></div>
      <div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" required /></div>
      <div class="form-field"><label for="grade">Current grade</label><input id="grade" name="grade" type="text" placeholder="e.g. 9th grade" /></div>
      <div class="form-field"><label for="why">What brings you here?</label><textarea id="why" name="why" rows="4" placeholder="Tell us what you're looking for…"></textarea></div>
      <button type="submit" class="submit-btn">Send my interest →</button>
    </form>
  </div>

</body>
</html>
